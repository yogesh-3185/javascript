<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        //number
        let age = 23;
        console.log(age , typeof age);

        let n = 3345.3;
        console.log(n , typeof n);

        let y =2442424424241411n;
        console.log(y , typeof y)


        //string
        let name ="yogesh";
        console.log(name ,typeof name);

        let firstname = "3453";
        console.log(firstname ,typeof firstname);

        //boolean
        na =true;
        console.log(na , typeof na);

        nam =false;
        console.log(nam ,typeof nam);

        //undefine
        let value;
        console.log(value ,typeof value)

        //object
        let addres1=null;
        console.log(addres1 ,typeof addres1)

        //symbol
        cityname = Symbol("id");
        console.log(cityname , typeof cityname)
    </script>
    
</body>
</html>
