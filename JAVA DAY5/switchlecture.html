<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- SWITCH STATEMENT -->
    <!-- THE SWITCH STATEMENT IS USED TO COMPARE ONE EXPRESSION WITH MULTIPLE VALUES (CASE) -->


    <script>

        let day=3;
        switch (day) {
            case 1:
                document.writ("monday");
                
                break;
            case 2:
                document.write("tuesday");
                break;
            case 3:
                document.write("wednesday");
                break;
            case 4:

            document.write("thrusday");
            break;
        
            default:
                document.write("invalid day");
                break;
        }

        let name="rahul";
        switch (name) {
            case "rohan":
                document.writ("hjfjhkk");
                
                break;
            case "ronak":
                document.write("fgkgk");
                break;
            case "nilesh":
                document.write("fguwy");
                break;
            case "rahul":

                document.write("hello how are you");
                break;
        
            default:
                document.write("invalid name");
                break;
        }


    </script>
    
</body>
</html>
